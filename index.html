<!DOCTYPE html>
<html lang="id">

  <style>
    /* Overlay penuh menutupi elemen bawaan Blogger */
    #rumdin-app-root {
      position: fixed;
      inset: 0;
      z-index: 999999;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #F4F7FA;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1E293B;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar halus */
    #rumdin-app-root::-webkit-scrollbar {

    #rumdin-app-root::-webkit-scrollbar-thumb {

</head>
<body>
  <!-- Kontainer Utama Aplikasi -->
  <div id="rumdin-app-root"></div>

  <!-- Application Script (ES Module + Supabase JS v2) -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // =========================================================================
    // 1. KONFIGURASI SAKLAR DEPLOYMENT (WAJIB DIATUR SEBELUM DEPLOY)
    // =========================================================================
    const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY agar mode preview & data dummy hilang dan terhubung 100% ke Supabase
    const SUPABASE_URL = "https://gtbmdihkkrblmyagxwzs.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0Ym1kaWhra3JibG15YWd4d3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1Nzk3OTYsImV4cCI6MjExMTE1NTc5Nn0.BiXhnCxQcYm5FjzNtrpX9dAJt5-4KBE86O-WEYfKAWQ";
    const DEFAULT_FAVICON_URL = ""; // Bisa diatur kustom oleh Admin di pengaturan aplikasi

    // Inisialisasi Supabase Client (hanya aktif jika IS_PREVIEW === false)
    let supabase = null;
    if (!IS_PREVIEW) {
      if (!SUPABASE_URL.startsWith('http') || SUPABASE_ANON_KEY === 'ANON_KEY_ANDA') {
        console.error('Konfigurasi SUPABASE_URL dan SUPABASE_ANON_KEY belum diisi dengan benar.');
      } else {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    }

    // Helper Favicon Dinamis (localStorage + Supabase pengaturan_aplikasi + DEFAULT_FAVICON_URL)
    function getActiveFavicon() {
      const savedLocal = localStorage.getItem('sarpras_custom_favicon');
      if (savedLocal && savedLocal.trim()) return savedLocal.trim();
      if (state?.customFavicon && state.customFavicon.trim()) return state.customFavicon.trim();
      if (DEFAULT_FAVICON_URL && DEFAULT_FAVICON_URL.trim()) return DEFAULT_FAVICON_URL.trim();
      const fallbackSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1E62B5"/><path d="M32 14L12 30h6v20h12V38h4v12h12V30h6L32 14z" fill="#FFFFFF"/><circle cx="48" cy="18" r="6" fill="#D92B2B"/></svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(fallbackSvg);
    }

    function applyFaviconToHead() {
      const url = getActiveFavicon();
      const linkEl = document.getElementById('dynamicFaviconLink');
      if (linkEl) linkEl.href = url;
    }

    // =========================================================================
    // 2. INISIALISASI PWA 1-FILE (MANIFEST DATA URI + BLOB SERVICE WORKER)
    // =========================================================================
    (function initPWA() {
      try {
        const iconUri = getActiveFavicon();

        const manifestObj = {
          name: 'Portal Sarpras Sekolah',
          short_name: 'Sarpras Sekolah',
          description: 'Pendataan Sertifikat Tanah Sekolah & Survei Rumah Dinas Guru',
          start_url: location.href,
          display: 'standalone',
          background_color: '#F4F7FA',
          theme_color: '#1E62B5',
          icons: [
            { src: iconUri, sizes: '192x192', type: 'image/png' },
            { src: iconUri, sizes: '512x512', type: 'image/png' }
          ]
        };

        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
        document.head.appendChild(manifestLink);

        if ('serviceWorker' in navigator && location.protocol === 'https:') {
          const swCode = `
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
            self.addEventListener('fetch', (e) => {
              e.respondWith(fetch(e.request).catch(() => new Response('Offline', { status: 503 })));
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      } catch (err) {
        // Abaikan jika environment iframe membatasi SW
      }
    })();

    // =========================================================================
    // 3. DAFTAR STANDAR 16 KECAMATAN & DATA PREVIEW MINIMALIS
    // =========================================================================
    const DEFAULT_16_KECAMATAN = [
      'Kecamatan 01', 'Kecamatan 02', 'Kecamatan 03', 'Kecamatan 04',
      'Kecamatan 05', 'Kecamatan 06', 'Kecamatan 07', 'Kecamatan 08',
      'Kecamatan 09', 'Kecamatan 10', 'Kecamatan 11', 'Kecamatan 12',
      'Kecamatan 13', 'Kecamatan 14', 'Kecamatan 15', 'Kecamatan 16'
    ];

    // Data dummy minimalis (maksimal 2 baris) hanya aktif saat IS_PREVIEW = true
    let previewDataStore = IS_PREVIEW ? [
      {
        id: 'prev-1',
        npsn: '40100101',
        nama_sekolah: 'SD Negeri 01 Contoh Kota',
        alamat: 'Jl. Pendidikan No. 12',
        kecamatan: 'Kecamatan 01',
        sertifikat_submitted: true,
        status_sertifikat: 'Sudah Bersertifikat',
        nomor_sertifikat: 'SHM-01.12.0045',
        sertifikat_file_url: 'https://placehold.co/800x500/1E62B5/FFFFFF?text=Bukti+Sertifikat+SDN+01',
        sertifikat_submitted_at: new Date().toISOString(),
        rumdin_submitted: true,
        status_rumdin: 'Ada',
        kondisi_rumdin: 'Rusak Ringan',
        rumdin_foto_url: 'https://placehold.co/800x500/4A89DC/FFFFFF?text=Foto+Rumah+Dinas+SDN+01',
        rumdin_submitted_at: new Date().toISOString()
      },
      {
        id: 'prev-2',
        npsn: '40100102',
        nama_sekolah: 'SMP Negeri 02 Harapan Bangsa',
        alamat: 'Jl. Merdeka Utara No. 45',
        kecamatan: 'Kecamatan 02',
        sertifikat_submitted: false,
        status_sertifikat: null,
        nomor_sertifikat: null,
        sertifikat_file_url: null,
        sertifikat_submitted_at: null,
        rumdin_submitted: false,
        status_rumdin: null,
        kondisi_rumdin: null,
        rumdin_foto_url: null,
        rumdin_submitted_at: null
      }
    ] : [];

    // =========================================================================
    // 4. STATE APLIKASI TERPUSAT
    // =========================================================================
    const state = {
      session: null, // { role: 'admin' | 'school', user: {...} }
      loginTab: 'school', // 'school' | 'admin'
      activeAdminMenu: 'dashboard', // 'dashboard' | 'survei' | 'sekolah'
      analyticsCategory: 'gabungan', // 'gabungan' | 'sertifikat' | 'rumdin'
      customFavicon: localStorage.getItem('sarpras_custom_favicon') || DEFAULT_FAVICON_URL || '',
      sidebarCollapsed: false,
      loading: false,
      submittingSertifikat: false,
      submittingRumdin: false,
      allData: [],
      // Filter & Search pada Menu Data Hasil Survei
      searchQuery: '',
      filterCategory: 'all', // 'all' | 'sertifikat_done' | 'sertifikat_pending' | 'rumdin_ada' | 'rumdin_belum' | 'rumdin_pending'
      // Search pada Menu Database Referensi Sekolah
      refSearchQuery: '',
      // Form Sertifikat Sekolah
      sertifikatForm: {
        status_sertifikat: '', // 'Sudah Bersertifikat' | 'Belum Bersertifikat'
        nomor_sertifikat: '',
        file: null,
        previewDataUrl: ''
      },
      // Form Rumah Dinas Guru
      rumdinForm: {
        status_rumdin: '', // 'Ada' | 'Belum Ada'
        kondisi_rumdin: '', // 'Baik' | 'Rusak Ringan' | 'Rusak Berat'
        file: null,
        previewDataUrl: ''
      },
      // Modal States
      photoModalUrl: null,
      photoModalTitle: '',
      schoolModal: {
        open: false,
        mode: 'add', // 'add' | 'edit'
        data: { id: null, npsn: '', nama_sekolah: '', alamat: '', kecamatan: '' }
      },
      confirmModal: {
        open: false,
        title: '',
        message: '',
        confirmText: 'Ya, Lanjutkan',
        confirmColor: 'bg-[#D92B2B]',
        onConfirm: null
      },
      toast: null
    };

    let barChartInstance = null;
    let doughnutChartInstance = null;
    let clockInterval = null;

    // =========================================================================
    // 5. UTILITAS NOTIFIKASI (TOAST) & MODAL KONFIRMASI (TANPA ALERT/CONFIRM)
    // =========================================================================
    function showToast(message, type = 'info') {
      state.toast = { message, type };
      renderToast();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        state.toast = null;
        renderToast();
      }, 4000);
    }

    function openConfirm({ title, message, confirmText = 'Ya, Lanjutkan', confirmColor = 'bg-[#D92B2B]', onConfirm }) {
      state.confirmModal = { open: true, title, message, confirmText, confirmColor, onConfirm };
      render();
    }

    function closeConfirm() {
      state.confirmModal.open = false;
      render();
    }

    // =========================================================================
    // 6. OPERASI DATA & AUTENTIKASI (PREVIEW VS SUPABASE LIVE)
    // =========================================================================
    function syncSchoolFormFromUser(schoolData) {
      if (!schoolData.sertifikat_submitted) {
        state.sertifikatForm = {
          status_sertifikat: '',
          nomor_sertifikat: '',
          file: null,
          previewDataUrl: ''
        };
      }
      if (!schoolData.rumdin_submitted) {
        state.rumdinForm = {
          status_rumdin: '',
          kondisi_rumdin: '',
          file: null,
          previewDataUrl: ''
        };
      }
    }

    async function loadAppSettings() {
      if (IS_PREVIEW) return;
      if (!supabase) return;
      try {
        const { data } = await supabase
          .from('pengaturan_aplikasi')
          .select('favicon_url')
          .eq('id', 1)
          .maybeSingle();
        if (data && data.favicon_url) {
          state.customFavicon = data.favicon_url;
          localStorage.setItem('sarpras_custom_favicon', data.favicon_url);
          applyFaviconToHead();
        }
      } catch (e) {}
    }

    async function saveFaviconSetting(urlInput) {
      const cleanUrl = (urlInput || '').trim();
      state.customFavicon = cleanUrl;
      localStorage.setItem('sarpras_custom_favicon', cleanUrl);
      applyFaviconToHead();

      if (!IS_PREVIEW && supabase) {
        try {
          const { error } = await supabase
            .from('pengaturan_aplikasi')
            .upsert({ id: 1, favicon_url: cleanUrl, updated_at: new Date().toISOString() }, { onConflict: 'id' });
          if (error) throw error;
        } catch (err) {
          showToast('Tersimpan lokal; gagal sinkron ke Supabase: ' + err.message, 'error');
          render();
          return;
        }
      }
      showToast('Favicon / Logo kustom berhasil diperbarui!', 'success');
      render();
    }

    async function initSession() {
      applyFaviconToHead();
      if (IS_PREVIEW) {
        const saved = sessionStorage.getItem('sarpras_preview_session');
        if (saved) {
          state.session = JSON.parse(saved);
          await loadData();
        }
        render();
        return;
      }

      await loadAppSettings();

      if (supabase) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session && session.user) {
          state.session = { role: 'admin', user: { email: session.user.email } };
          await loadData();
          render();
          return;
        }
      }

      const savedSchool = sessionStorage.getItem('sarpras_school_npsn');
      if (savedSchool && supabase) {
        const { data, error } = await supabase
          .from('portal_sarpras_sekolah')
          .select('*')
          .eq('npsn', savedSchool)
          .maybeSingle();

        if (!error && data) {
          state.session = { role: 'school', user: data };
          syncSchoolFormFromUser(data);
        } else {
          sessionStorage.removeItem('sarpras_school_npsn');
        }
      }
      render();
    }

    async function loadData() {
      if (!state.session) return;
      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          state.allData = [...previewDataStore];
          if (state.session.role === 'school') {
            const fresh = state.allData.find(s => s.npsn === state.session.user.npsn);
            if (fresh) {
              state.session.user = fresh;
              sessionStorage.setItem('sarpras_preview_session', JSON.stringify(state.session));
            }
          }
        } else {
          if (!supabase) throw new Error('Koneksi Supabase belum dikonfigurasi.');
          if (state.session.role === 'admin') {
            const { data, error } = await supabase
              .from('portal_sarpras_sekolah')
              .select('*')
              .order('kecamatan', { ascending: true })
              .order('nama_sekolah', { ascending: true });
            if (error) throw error;
            state.allData = data || [];
          } else if (state.session.role === 'school') {
            const { data, error } = await supabase
              .from('portal_sarpras_sekolah')
              .select('*')
              .eq('npsn', state.session.user.npsn)
              .single();
            if (error) throw error;
            state.session.user = data;
          }
        }
      } catch (err) {
        showToast('Gagal memuat data: ' + (err.message || 'Terjadi kesalahan'), 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleSchoolLogin(npsnInput) {
      const npsn = (npsnInput || '').trim();
      if (!npsn) {
        showToast('Silakan masukkan NPSN sekolah Anda.', 'error');
        return;
      }

      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          const found = previewDataStore.find(item => item.npsn === npsn);
          if (!found) {
            throw new Error('NPSN tidak ditemukan di data preview. Gunakan 40100101 atau 40100102.');
          }
          state.session = { role: 'school', user: { ...found } };
          sessionStorage.setItem('sarpras_preview_session', JSON.stringify(state.session));
          syncSchoolFormFromUser(found);
          showToast(`Selamat datang, ${found.nama_sekolah}!`, 'success');
        } else {
          if (!supabase) throw new Error('Supabase belum dikonfigurasi.');
          const { data, error } = await supabase
            .from('portal_sarpras_sekolah')
            .select('*')
            .eq('npsn', npsn)
            .maybeSingle();

          if (error) throw error;
          if (!data) {
            throw new Error('NPSN tidak terdaftar dalam database referensi sekolah.');
          }

          state.session = { role: 'school', user: data };
          sessionStorage.setItem('sarpras_school_npsn', data.npsn);
          syncSchoolFormFromUser(data);
          showToast(`Berhasil masuk sebagai ${data.nama_sekolah}`, 'success');
        }
      } catch (err) {
        showToast(err.message || 'Gagal login sekolah.', 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleAdminLogin(emailInput, passwordInput) {
      const email = (emailInput || '').trim();
      const password = (passwordInput || '').trim();

      if (!email || !password) {
        showToast('Email dan password Admin wajib diisi.', 'error');
        return;
      }

      state.loading = true;
      render();

      try {
        if (IS_PREVIEW) {
          state.session = { role: 'admin', user: { email: email || 'admin@preview.local' } };
          sessionStorage.setItem('rumdin_preview_session', JSON.stringify(state.session));
          await loadData();
          showToast('Berhasil masuk sebagai Admin (Mode Preview).', 'success');
        } else {
          if (!supabase) throw new Error('Supabase belum dikonfigurasi.');
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          state.session = { role: 'admin', user: { email: data.user.email } };
          await loadData();
          showToast('Login Admin berhasil!', 'success');
        }
      } catch (err) {
        showToast('Login Admin gagal: ' + (err.message || 'Kredensial tidak valid'), 'error');
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleLogout() {
      try {
        if (!IS_PREVIEW && supabase && state.session?.role === 'admin') {
          await supabase.auth.signOut();
        }
      } catch (e) {}

      sessionStorage.removeItem('sarpras_preview_session');
      sessionStorage.removeItem('sarpras_school_npsn');
      state.session = null;
      state.allData = [];
      state.sertifikatForm = { status_sertifikat: '', nomor_sertifikat: '', file: null, previewDataUrl: '' };
      state.rumdinForm = { status_rumdin: '', kondisi_rumdin: '', file: null, previewDataUrl: '' };
      showToast('Anda telah keluar dari aplikasi.', 'info');
      render();
    }

    // =========================================================================
    // 7. OPERASI FORM SEKOLAH: SERTIFIKAT TANAH & RUMAH DINAS GURU (MAX 1MB)
    // =========================================================================
    function handleSertifikatFileChange(file) {
      if (!file) return;
      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg', 'application/pdf'];
      if (!allowedTypes.includes(file.type)) {
        showToast('Format file bukti sertifikat harus JPG, PNG, WEBP, atau PDF.', 'error');
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        showToast('Ukuran file bukti sertifikat maksimal 2 MB.', 'error');
        return;
      }

      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
          state.sertifikatForm.file = file;
          state.sertifikatForm.previewDataUrl = e.target.result;
          render();
        };
        reader.readAsDataURL(file);
      } else {
        state.sertifikatForm.file = file;
        state.sertifikatForm.previewDataUrl = 'PDF_DOC:' + file.name;
        render();
      }
    }

    async function submitSertifikatSurvey() {
      const school = state.session?.user;
      if (!school || school.sertifikat_submitted) return;

      const { status_sertifikat, nomor_sertifikat, file, previewDataUrl } = state.sertifikatForm;
      if (!status_sertifikat) {
        showToast('Silakan pilih status sertifikat tanah sekolah.', 'error');
        return;
      }
      if (status_sertifikat === 'Sudah Bersertifikat' && !file) {
        showToast('Silakan unggah foto/dokumen bukti sertifikat tanah.', 'error');
        return;
      }

      state.submittingSertifikat = true;
      render();

      try {
        let docUrl = null;
        if (file) {
          if (IS_PREVIEW) {
            docUrl = previewDataUrl.startsWith('PDF_DOC:')
              ? 'https://placehold.co/800x500/1E62B5/FFFFFF?text=Dokumen+PDF+Sertifikat'
              : previewDataUrl;
          } else {
            const ext = file.name.split('.').pop() || 'jpg';
            const path = `sertifikat/${school.npsn}_${Date.now()}.${ext}`;
            const { error: upErr } = await supabase.storage
              .from('berkas-sarpras')
              .upload(path, file, { cacheControl: '3600', upsert: true, contentType: file.type });
            if (upErr) throw new Error('Gagal mengunggah bukti sertifikat: ' + upErr.message);

            const { data: pub } = supabase.storage.from('berkas-sarpras').getPublicUrl(path);
            docUrl = pub.publicUrl;
          }
        }

        const payload = {
          sertifikat_submitted: true,
          status_sertifikat,
          nomor_sertifikat: (nomor_sertifikat || '').trim() || null,
          sertifikat_file_url: docUrl,
          sertifikat_submitted_at: new Date().toISOString()
        };

        if (IS_PREVIEW) {
          const idx = previewDataStore.findIndex(item => item.npsn === school.npsn);
          if (idx !== -1) {
            previewDataStore[idx] = { ...previewDataStore[idx], ...payload };
            state.session.user = { ...previewDataStore[idx] };

          }
        } else {
          const { data, error } = await supabase
            .from('portal_sarpras_sekolah')
            .update(payload)
            .eq('id', school.id)
            .select()
            .single();
          if (error) throw error;
          state.session.user = data;
        }

        showToast('Data Sertifikat Sekolah berhasil dikirim & dikunci otomatis!', 'success');

    function handlePhotoFileChange(file) {
      if (!file) return;

      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/jpg'];
      if (!allowedTypes.includes(file.type)) {
        showToast('Format foto harus berupa JPG, PNG, atau WEBP.', 'error');
        return;
      }

      // Validasi ketat maksimal 1 MB (1048576 bytes)
      const MAX_BYTES = 1048576;
      if (file.size > MAX_BYTES) {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        showToast(`Ukuran file (${sizeMB} MB) melebihi batas maksimal 1 MB! Silakan kompres foto terlebih dahulu.`, 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        state.rumdinForm.file = file;
        state.rumdinForm.previewDataUrl = e.target.result;
        render();
      };
      reader.readAsDataURL(file);
    }

    async function submitSchoolSurvey() {
      const school = state.session?.user;
      if (!school || school.rumdin_submitted) return;

      const { status_rumdin, kondisi_rumdin, file, previewDataUrl } = state.rumdinForm;

      if (!status_rumdin) {
        showToast('Silakan pilih jawaban ketersediaan Rumah Dinas (Ada atau Belum Ada).', 'error');
        return;
      }

      if (status_rumdin === 'Ada') {
        if (!file) {
          showToast('Anda wajib mengunggah foto kondisi Rumah Dinas (Maks. 1 MB).', 'error');
          return;
        }
        if (file.size > 1048576) {
          showToast('Ukuran foto melebihi batas maksimal 1 MB!', 'error');
          return;
        }
        if (!kondisi_rumdin) {
          showToast('Silakan pilih kondisi Rumah Dinas (Baik, Rusak Ringan, atau Rusak Berat).', 'error');
          return;
        }
      }

      state.submittingRumdin = true;
      render();

      try {
        let uploadedUrl = null;

        if (status_rumdin === 'Ada') {
          if (IS_PREVIEW) {
            uploadedUrl = previewDataUrl;
          } else {
            const ext = file.name.split('.').pop() || 'jpg';
            const filePath = `rumdin/${school.npsn}_${Date.now()}.${ext}`;

            const { error: uploadError } = await supabase.storage
              .from('berkas-sarpras')
              .upload(filePath, file, {
                cacheControl: '3600',
                upsert: true,
                contentType: file.type
              });

            if (uploadError) {
              throw new Error('Gagal mengunggah foto ke Storage: ' + uploadError.message);
            }

            const { data: publicUrlData } = supabase.storage
              .from('berkas-sarpras')
              .getPublicUrl(filePath);

            uploadedUrl = publicUrlData.publicUrl;
          }
        }

        const payload = {
          rumdin_submitted: true,
          status_rumdin: status_rumdin,
          kondisi_rumdin: status_rumdin === 'Ada' ? kondisi_rumdin : null,
          rumdin_foto_url: status_rumdin === 'Ada' ? uploadedUrl : null,
          rumdin_submitted_at: new Date().toISOString()
        };

        if (IS_PREVIEW) {
          const idx = previewDataStore.findIndex(item => item.npsn === school.npsn);
          if (idx !== -1) {
            previewDataStore[idx] = { ...previewDataStore[idx], ...payload };
            state.session.user = { ...previewDataStore[idx] };
            sessionStorage.setItem('sarpras_preview_session', JSON.stringify(state.session));
          }
        } else {
          const { data, error } = await supabase
            .from('portal_sarpras_sekolah')
            .update(payload)
            .eq('id', school.id)
            .select()
            .single();

          if (error) throw error;
          state.session.user = data;
        }

        showToast('Survei Rumah Dinas berhasil dikirim dan dikunci secara otomatis!', 'success');
      } catch (err) {
        showToast(err.message || 'Gagal mengirim survei rumah dinas.', 'error');
      } finally {
        state.submittingRumdin = false;
        render();
      }
    }

    async function handleBulkImportFile(file) {
      if (!file) return;
      state.loading = true;
      render();

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

        if (!rows.length) {
          throw new Error('File Excel/CSV kosong.');
        }

        const parsedRecords = [];
        const seenNpsn = new Set();

        for (const row of rows) {
          const normalized = {};
          Object.keys(row).forEach(k => {
            normalized[k.trim().toLowerCase()] = String(row[k]).trim();
          });

          const npsn = normalized['npsn'] || normalized['kode_sekolah'] || normalized['kode'] || '';
          const nama_sekolah = normalized['nama sekolah'] || normalized['nama_sekolah'] || normalized['sekolah'] || '';
          const alamat = normalized['alamat'] || normalized['alamat sekolah'] || normalized['alamat_sekolah'] || '-';
          const kecamatan = normalized['kecamatan'] || normalized['wilayah'] || '';

          if (npsn && nama_sekolah && kecamatan && !seenNpsn.has(npsn)) {
            seenNpsn.add(npsn);
            parsedRecords.push({ npsn, nama_sekolah, alamat, kecamatan });
          }
        }

        if (!parsedRecords.length) {
          throw new Error('Format kolom tidak valid. Pastikan terdapat kolom: NPSN, Nama Sekolah, Alamat, dan Kecamatan.');
        }

        if (IS_PREVIEW) {
          parsedRecords.forEach((rec, i) => {
            const existIdx = previewDataStore.findIndex(s => s.npsn === rec.npsn);
            if (existIdx !== -1) {
              previewDataStore[existIdx] = { ...previewDataStore[existIdx], ...rec };
            } else {
              previewDataStore.push({
                id: 'imp-' + Date.now() + '-' + i,
                ...rec,
                sertifikat_submitted: false,
                status_sertifikat: null,
                nomor_sertifikat: null,
                sertifikat_file_url: null,
                sertifikat_submitted_at: null,
                rumdin_submitted: false,
                status_rumdin: null,
                kondisi_rumdin: null,
                rumdin_foto_url: null,
                rumdin_submitted_at: null
              });
            }
          });
        } else {
          const { error } = await supabase
            .from('portal_sarpras_sekolah')
            .upsert(parsedRecords, { onConflict: 'npsn', ignoreDuplicates: false });
          if (error) throw error;
        }

        await loadData();
        showToast(`Berhasil mengimpor ${parsedRecords.length} data referensi sekolah!`, 'success');
      } catch (err) {
        showToast('Gagal impor file: ' + (err.message || 'Format file bermasalah'), 'error');
        state.loading = false;
        render();
      }
    }

    // =========================================================================
    // 9. FILTER DATA & EKSPOR LAPORAN TERPADU (EXCEL & PDF)
    // =========================================================================
    function getFilteredSurveiData() {
      const q = state.searchQuery.toLowerCase().trim();
      return state.allData.filter(item => {
        const matchQuery = !q ||
          (item.nama_sekolah || '').toLowerCase().includes(q) ||
          (item.kecamatan || '').toLowerCase().includes(q) ||
          (item.npsn || '').toLowerCase().includes(q);

        if (!matchQuery) return false;

        switch (state.filterCategory) {
          case 'sertifikat_done':
            return item.sertifikat_submitted === true;
          case 'sertifikat_pending':
            return !item.sertifikat_submitted;
          case 'rumdin_ada':
            return item.rumdin_submitted && item.status_rumdin === 'Ada';
          case 'rumdin_belum':
            return item.rumdin_submitted && item.status_rumdin === 'Belum Ada';
          case 'rumdin_pending':
            return !item.rumdin_submitted;
          default:
            return true;
        }
      });
    }

    // =========================================================================
    // 10. KALKULASI STATISTIK & GRAFIK CHART.JS (70% STACKED BAR : 30% DOUGHNUT)
    // =========================================================================
    function computeAnalytics() {
      const total = state.allData.length;
      const sertifikatDone = state.allData.filter(d => d.sertifikat_submitted).length;
      const sertifikatBersertifikat = state.allData.filter(d => d.sertifikat_submitted && d.status_sertifikat === 'Sudah Bersertifikat').length;
      const sertifikatBelum = state.allData.filter(d => d.sertifikat_submitted && d.status_sertifikat !== 'Sudah Bersertifikat').length;

      const rumdinDone = state.allData.filter(d => d.rumdin_submitted).length;
      const rumdinAda = state.allData.filter(d => d.rumdin_submitted && d.status_rumdin === 'Ada').length;
      const rumdinBelumAda = state.allData.filter(d => d.rumdin_submitted && d.status_rumdin === 'Belum Ada').length;

      const kondisiBaik = state.allData.filter(d => d.kondisi_rumdin === 'Baik').length;
      const kondisiRingan = state.allData.filter(d => d.kondisi_rumdin === 'Rusak Ringan').length;
      const kondisiBerat = state.allData.filter(d => d.kondisi_rumdin === 'Rusak Berat').length;

      const bothDone = state.allData.filter(d => d.sertifikat_submitted && d.rumdin_submitted).length;

      // Bangun tepat 16 Kecamatan
      const dataKecSet = new Set(state.allData.map(d => (d.kecamatan || '').trim()).filter(Boolean));
      const kecList = Array.from(dataKecSet);
      for (const defKec of DEFAULT_16_KECAMATAN) {
        if (kecList.length >= 16) break;
        if (!dataKecSet.has(defKec)) {
          kecList.push(defKec);
          dataKecSet.add(defKec);
        }
      }
      const final16Kecamatan = kecList.slice(0, 16);

      const kecStats = final16Kecamatan.map(kec => {
        const schoolsInKec = state.allData.filter(d => (d.kecamatan || '').trim() === kec);
        let sCount = 0;
        if (state.analyticsCategory === 'sertifikat') {
          sCount = schoolsInKec.filter(d => d.sertifikat_submitted).length;
        } else if (state.analyticsCategory === 'rumdin') {
          sCount = schoolsInKec.filter(d => d.rumdin_submitted).length;
        } else {
          // Gabungan: dianggap sudah mengisi jika sudah mengisi salah satu atau keduanya
          sCount = schoolsInKec.filter(d => d.sertifikat_submitted || d.rumdin_submitted).length;
        }
        const uCount = schoolsInKec.length - sCount;
        return { kecamatan: kec, sudah: sCount, belum: uCount };
      });

      // Nilai Doughnut (70:30 kanan) berdasarkan kategori analitik aktif
      let doughnutPos = rumdinAda;
      let doughnutNeg = rumdinBelumAda;
      let doughnutPosLabel = 'Ada Rumdin';
      let doughnutNegLabel = 'Belum Ada';

      if (state.analyticsCategory === 'sertifikat') {
        doughnutPos = sertifikatBersertifikat;
        doughnutNeg = sertifikatBelum;
        doughnutPosLabel = 'Bersertifikat';
        doughnutNegLabel = 'Belum / Proses';
      } else if (state.analyticsCategory === 'gabungan') {
        doughnutPos = bothDone;
        doughnutNeg = Math.max(total - bothDone, 0);
        doughnutPosLabel = 'Tuntas Keduanya';
        doughnutNegLabel = 'Belum Tuntas';
      }

      return {
        total,
        sertifikatDone,
        sertifikatBersertifikat,
        sertifikatBelum,
        rumdinDone,
        rumdinAda,
        rumdinBelumAda,
        kondisiBaik,
        kondisiRingan,
        kondisiBerat,
        bothDone,
        kecStats,
        doughnutPos,
        doughnutNeg,
        doughnutPosLabel,
        doughnutNegLabel
      };
    }

    function renderCharts() {
      if (state.session?.role !== 'admin' || state.activeAdminMenu !== 'dashboard') return;

      const barCanvas = document.getElementById('kecamatanStackedChart');
      const doughnutCanvas = document.getElementById('rumdinDoughnutChart');
      if (!barCanvas || !doughnutCanvas) return;

      const stats = computeAnalytics();

      if (barChartInstance) {
        barChartInstance.destroy();
        barChartInstance = null;
      }
      if (doughnutChartInstance) {
        doughnutChartInstance.destroy();
        doughnutChartInstance = null;
      }

      // 1. Stacked Bar Chart (16 Kecamatan: Biru #1E62B5 = Sudah Mengisi, Silver #CBD5E1 = Belum Mengisi)
      barChartInstance = new Chart(barCanvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: stats.kecStats.map(k => k.kecamatan),
          datasets: [
            {
              label: 'Sudah Mengisi',
              data: stats.kecStats.map(k => k.sudah),
              backgroundColor: '#1E62B5',

              categoryPercentage: 0.8
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              position: 'top',
              align: 'end',
              labels: {
                usePointStyle: true,
                pointStyle: 'rectRounded',
                boxWidth: 10,
                font: { family: 'Plus Jakarta Sans', size: 12, weight: '600' },

              }
            },
            tooltip: {
              backgroundColor: '#1E293B',

              grid: { display: false },

              }

            }
          }
        }
      });

      // 2. Doughnut Chart (30% kanan)
      const totalD = stats.doughnutPos + stats.doughnutNeg;
      doughnutChartInstance = new Chart(doughnutCanvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: [stats.doughnutPosLabel, stats.doughnutNegLabel],
          datasets: [{
            data: totalD > 0 ? [stats.doughnutPos, stats.doughnutNeg] : [1],
            backgroundColor: totalD > 0 ? ['#1E62B5', '#D92B2B'] : ['#E2E8F0'],
            hoverBackgroundColor: totalD > 0 ? ['#174E93', '#B91C1C'] : ['#CBD5E1'],

        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '72%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: totalD > 0, backgroundColor: '#1E293B', padding: 10 }

        }
      });

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderToast() {
      let container = document.getElementById('rumdin-toast-box');
      if (!container) {
        container = document.createElement('div');
        container.id = 'rumdin-toast-box';
        container.className = 'fixed top-4 right-4 z-[1000005] max-w-sm w-full pointer-events-none px-4 sm:px-0';
        document.getElementById('rumdin-app-root').appendChild(container);
      }

      if (!state.toast) {
        container.innerHTML = '';
        return;
      }

      const styles = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-[#D92B2B] text-white border-red-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      const icons = {
        success: 'check-circle',
        error: 'alert-octagon',
        info: 'info'
      };

      container.innerHTML = `
        <div class="pointer-events-auto flex items-start gap-2.5 p-3.5 rounded-xl shadow-xl border ${styles[state.toast.type] || styles.info} animate-fade-in">
          <i data-lucide="${icons[state.toast.type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i>
          <div class="text-xs font-semibold leading-relaxed flex-1">${escapeHtml(state.toast.message)}</div>
        </div>
      `;
      if (window.lucide) window.lucide.createIcons();
    }

    function updateDigitalClock() {
      const el = document.getElementById('liveDigitalClock');
      if (el) {
        el.textContent = new Date().toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }
    }

    function render() {
      const root = document.getElementById('rumdin-app-root');
      if (!root) return;

      let content = '';
      if (!state.session) {
        content = renderLoginScreen();
      } else if (state.session.role === 'admin') {
        content = renderAdminLayout();
      } else {
        content = renderSchoolView();
      }

      content += renderModals();
      root.innerHTML = content;

      // Render Ikon Lucide
      if (window.lucide) {
        window.lucide.createIcons();
      }

      // Render Toast jika sedang aktif
      renderToast();

      // Update jam digital
      updateDigitalClock();

      // Render grafik Chart.js jika di halaman Dashboard Admin
      renderCharts();

      // Pasang listener input dinamis
      bindDynamicInputs();
    }

    // =========================================================================
    // 12. EVENT DELEGATION & INPUT LISTENERS
    // =========================================================================
    function bindDynamicInputs() {
      const schoolLoginForm = document.getElementById('schoolLoginForm');
      if (schoolLoginForm) {
        schoolLoginForm.onsubmit = (e) => {
          e.preventDefault();
          const npsn = document.getElementById('inputNpsn')?.value;
          handleSchoolLogin(npsn);
        };
      }

      const adminLoginForm = document.getElementById('adminLoginForm');
      if (adminLoginForm) {
        adminLoginForm.onsubmit = (e) => {
          e.preventDefault();
          const email = document.getElementById('inputAdminEmail')?.value;
          const pass = document.getElementById('inputAdminPassword')?.value;
          handleAdminLogin(email, pass);
        };
      }

      const surveiSearchInput = document.getElementById('surveiSearchInput');
      if (surveiSearchInput) {
        surveiSearchInput.oninput = (e) => {
          state.searchQuery = e.target.value;
          render();
          const el = document.getElementById('surveiSearchInput');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        };
      }

      const surveiFilterSelect = document.getElementById('surveiFilterSelect');
      if (surveiFilterSelect) {
        surveiFilterSelect.onchange = (e) => {
          state.filterCategory = e.target.value;
          render();
        };
      }

      const refSearchInput = document.getElementById('refSearchInput');
      if (refSearchInput) {
        refSearchInput.oninput = (e) => {
          state.refSearchQuery = e.target.value;
          render();
          const el = document.getElementById('refSearchInput');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        };
      }

      const bulkUploadInput = document.getElementById('bulkUploadInput');
      if (bulkUploadInput) {
        bulkUploadInput.onchange = (e) => {
          if (e.target.files?.[0]) {
            handleBulkImportFile(e.target.files[0]);
          }
        };
      }

      const sertifikatNomorInput = document.getElementById('sertifikatNomorInput');
      if (sertifikatNomorInput) {
        sertifikatNomorInput.oninput = (e) => {
          state.sertifikatForm.nomor_sertifikat = e.target.value;
        };
      }

      const sertifikatFileInput = document.getElementById('sertifikatFileInput');
      if (sertifikatFileInput) {
        sertifikatFileInput.onchange = (e) => {
          if (e.target.files?.[0]) {
            handleSertifikatFileChange(e.target.files[0]);
          }
        };
      }

      const schoolPhotoInput = document.getElementById('schoolPhotoInput');
      if (schoolPhotoInput) {
        schoolPhotoInput.onchange = (e) => {
          if (e.target.files?.[0]) {
            handlePhotoFileChange(e.target.files[0]);
          }
        };
      }

      const schoolCrudForm = document.getElementById('schoolCrudForm');
      if (schoolCrudForm) {
        schoolCrudForm.onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(schoolCrudForm);
          saveSchoolManual({
            npsn: fd.get('npsn'),
            nama_sekolah: fd.get('nama_sekolah'),
            alamat: fd.get('alamat'),
            kecamatan: fd.get('kecamatan')
          });
        };
      }
    }

    document.getElementById('rumdin-app-root').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'switch-login-tab':
          state.loginTab = btn.getAttribute('data-tab');
          render();
          break;

        case 'save-favicon-login': {
          const val = document.getElementById('loginFaviconInput')?.value || '';
          saveFaviconSetting(val);
          break;
        }

        case 'save-favicon-admin': {
          const val = document.getElementById('adminFaviconInput')?.value || '';
          saveFaviconSetting(val);
          break;
        }

        case 'switch-analytics-cat':
          state.analyticsCategory = btn.getAttribute('data-cat');
          render();
          break;

        case 'quick-login-admin':
          if (IS_PREVIEW) handleAdminLogin('admin@preview.local', 'preview');
          break;

        case 'quick-login-school':
          if (IS_PREVIEW) handleSchoolLogin('40100102');
          break;

        case 'logout':
          handleLogout();
          break;

        case 'toggle-sidebar':
          state.sidebarCollapsed = !state.sidebarCollapsed;
          render();
          break;

        case 'nav-admin':
          state.activeAdminMenu = btn.getAttribute('data-menu');
          render();
          break;

        case 'export-excel':
          exportToExcel();
          break;

        case 'export-pdf':
          exportToPDF();
          break;

        case 'view-photo':
          state.photoModalUrl = btn.getAttribute('data-url');
          state.photoModalTitle = btn.getAttribute('data-title');
          render();
          break;

        case 'close-photo-modal':
          state.photoModalUrl = null;
          state.photoModalTitle = '';
          render();
          break;

        case 'reset-sertifikat': {
          const id = btn.getAttribute('data-id');
          const target = state.allData.find(s => String(s.id) === String(id));
          if (target) confirmResetSection(target, 'sertifikat');
          break;
        }

        case 'reset-rumdin': {
          const id = btn.getAttribute('data-id');
          const target = state.allData.find(s => String(s.id) === String(id));
          if (target) confirmResetSection(target, 'rumdin');
          break;
        }

        case 'download-template':
          downloadTemplateExcel();
          break;

        case 'open-add-school':
          state.schoolModal = {
            open: true,
            mode: 'add',
            data: { id: null, npsn: '', nama_sekolah: '', alamat: '', kecamatan: '' }
          };
          render();
          break;

        case 'open-edit-school': {
          const id = btn.getAttribute('data-id');
          const target = state.allData.find(s => String(s.id) === String(id));
          if (target) {
            state.schoolModal = { open: true, mode: 'edit', data: { ...target } };
            render();
          }
          break;
        }

        case 'close-school-modal':
          state.schoolModal.open = false;
          render();
          break;

        case 'delete-school': {
          const id = btn.getAttribute('data-id');
          const target = state.allData.find(s => String(s.id) === String(id));
          if (target) confirmDeleteSchool(target);
          break;
        }

        case 'select-sertifikat-status':
          state.sertifikatForm.status_sertifikat = btn.getAttribute('data-value');
          render();
          break;

        case 'submit-sertifikat':
          submitSertifikatSurvey();
          break;

        case 'select-rumdin':
          state.rumdinForm.status_rumdin = btn.getAttribute('data-value');
          if (state.rumdinForm.status_rumdin === 'Belum Ada') {
            state.rumdinForm.kondisi_rumdin = '';
            state.rumdinForm.file = null;
            state.rumdinForm.previewDataUrl = '';
          }
          render();
          break;

        case 'select-kondisi':
          state.rumdinForm.kondisi_rumdin = btn.getAttribute('data-value');
          render();
          break;

        case 'submit-school-survey':
          submitSchoolSurvey();
          break;

        case 'close-confirm':
          closeConfirm();
          break;

        case 'execute-confirm':
          if (typeof state.confirmModal.onConfirm === 'function') {
            state.confirmModal.onConfirm();
          }
          break;
      }
    });

    // Jalankan Jam Digital & Inisialisasi Sesi saat Halaman Dimuat
    window.addEventListener('DOMContentLoaded', () => {
      clockInterval = setInterval(updateDigitalClock, 1000);
      initSession();
    });
  </script>
</body>
</html>
